<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>control de acceso</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>control de acceso a la discoteca</h1>
    <p>introduce tu edad para verificar si puedes entrar o no</p>
    <main>  
    <label for="edad">ingresa tu edad</label>
    <input type="text" id="edad" placeholder="ingresa tu edad">
    <button onclick="comprobarAcceso()">mostrar edad</button>
    <p id="resultadoTexto" class="resultado"></p>
    <img src="discoteca.png"imagen de la discoteca" class="imagen">
    </main>
</body>
</html>
