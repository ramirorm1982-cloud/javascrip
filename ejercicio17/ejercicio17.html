<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuaderno de notas</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="cuaderno">
  <h1>Cuaderno de notas</h1>
  <!--formulario pra ingresar alumnos-->
  <label>Nombre <input id="nombre" type="text"></label>
  <label>Nota <input id="nota" type="number"></label>
  <button onclick="guardarAlumno()">Guardar alumno</button>
  <p id="contador">Alumnos registrados: 0</p>
  <button onclick="mostrarNotas()">Mostrar notas</button>
  <p id="mensaje"></p>
  <p id="resultado"></p>
  <h2>frutas</h2>
  <label>Ingrese las frutas</label>
  <input type="text" id="nuevaFruta" placeholder="Ingrese nueva fruta">
  <p id ="frutas"></p>
  <button onclick="agregarFrutas()">Agregar frutas</button>
  <button onclick="mostrarFrutas()">Mostrar frutas</button>
  
  
</main>
</body>
</html>
